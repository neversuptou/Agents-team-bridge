name: teambridge
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tb
      POSTGRES_PASSWORD: "${TB_DB_PASSWORD}"
      POSTGRES_DB: tb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tb -d tb"]
      interval: 3s
      timeout: 3s
      retries: 20
  hub:
    build: { context: .., dockerfile: hub/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      TB_DATABASE_URL: "postgres://tb:${TB_DB_PASSWORD}@postgres:5432/tb"
      TB_SALT: "${TB_SALT}"
      TB_PORT: "8120"
      TB_TLS_CERT: /tls/server.crt
      TB_TLS_KEY: /tls/server.key
    volumes:
      - ./tls/server.crt:/tls/server.crt:ro
      - ./tls/server.key:/tls/server.key:ro
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports: ["8120:8120"]
volumes:
  pgdata: {}
